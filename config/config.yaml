# Polymarket snapshot-based p_yes modeling

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"

features:
  target: "residual_yes_minus_price"
  numerical_features: 25
  text_model: "all-MiniLM-L6-v2"
  text_embed_dim: 384
  use_dummy_text: false
  snapshot_offset_days: 7
  snapshot_horizons_days: [1, 3, 7, 14, 30]
  calendar_windows_days: [1, 3, 7, 14, 30]
  calibration: "auto"
  calibration_tolerance: 0.005

gbdt_model:
  candidate_configs:
    - learning_rate: 0.03
      max_depth: 4
      max_iter: 400
      min_samples_leaf: 30
      l2_regularization: 0.0
    - learning_rate: 0.03
      max_depth: 6
      max_iter: 500
      min_samples_leaf: 20
      l2_regularization: 0.0
    - learning_rate: 0.05
      max_depth: 6
      max_iter: 300
      min_samples_leaf: 40
      l2_regularization: 0.1
    - learning_rate: 0.05
      max_depth: 8
      max_iter: 400
      min_samples_leaf: 20
      l2_regularization: 0.0
    - learning_rate: 0.07
      max_depth: 6
      max_iter: 250
      min_samples_leaf: 50
      l2_regularization: 0.2
    - learning_rate: 0.1
      max_depth: 4
      max_iter: 250
      min_samples_leaf: 40
      l2_regularization: 0.1

ts_data:
  processed_dir: "data/processed_ts"
  sequence_lookback_days: 30
  sequence_grid_hours: 12
  seq_len: 60
  min_points: 2
  snapshot_offset_days: 7
  adaptive_cutoff: false

model:
  task: "classification"
  category_embed_dim: 8
  hidden_dims: [256, 128, 64]
  dropout: 0.2

ts_model:
  category_embed_dim: 8
  hidden_dim: 128
  static_hidden_dim: 128
  num_layers: 1
  dropout: 0.2

training:
  epochs: 24
  learning_rate: 0.001
  batch_size: 256
  val_split: 0.15
  test_split: 0.15
  split_strategy: "temporal_grouped"
  seed: 42
  patience: 5
  save_dir: "data/models/market_value_baseline"

ts_training:
  epochs: 20
  learning_rate: 0.001
  batch_size: 256
  val_split: 0.15
  test_split: 0.15
  split_strategy: "temporal_grouped"
  patience: 5
  seed: 42
  save_dir: "data/models/price_sequence_gru"

scoring:
  top_k: 100
  buy_threshold: 0.60
  strong_buy_threshold: 0.75
  buy_ev_threshold: 0.03
  strong_buy_ev_threshold: 0.07
  buy_roi_threshold: 0.10
  strong_buy_roi_threshold: 0.20
  expected_roi_cap: 5.0
  min_price_yes: 0.03
  max_price_yes: 0.85
  max_days_to_end: 30.0
  min_liquidity: 1000.0
  min_volume_24h: 100.0
  max_spread: 0.10

model_selection:
  primary_model_selection_metric: "topk_ev"
