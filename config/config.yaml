# ═══════════════════════════════════════════════════════════════
# Polymarket ML Trading Signal Analyzer - Configuration
# ═══════════════════════════════════════════════════════════════

# API URLs
api:
  gamma_base: "https://gamma-api.polymarket.com"
  clob_base: "https://clob.polymarket.com"
  data_base: "https://data-api.polymarket.com"
  rate_limit_delay: 0.2  # seconds between API calls

# Data fetching
# Todo el training viene de resueltos: tienen serie temporal completa + outcome (label).
# Cualquier punto de su historia simula un "mercado activo" — no se necesitan activos para entrenar.
# Los activos se descargan en cantidad pequeña solo para el demo de scoring en vivo.
data:
  max_active_markets: 1200      # pedir 1200 → ~1000 únicos tras dedup (~15% duplicados API)
  max_resolved_markets: 32000   # pedir 32k → ~22k únicos tras dedup → ~20k con histories reales
  # max_order_books: sin definir = todos los activos descargados (sin límite artificial)
  raw_dir: "data/raw"
  processed_dir: "data/processed"

# Feature engineering
features:
  numerical_features: 23
  text_model: "all-MiniLM-L6-v2"
  text_embed_dim: 384
  use_dummy_text: false       # Set to true for testing without sentence-transformers
  snapshot_offset_days: 7    # Días antes del endDate para el snapshot anti-leakage (baseline)
  adaptive_cutoff: true      # Fallback adaptivo para mercados de vida < offset días

# Time-series dataset (segundo modelo)
ts_data:
  processed_dir: "data/processed_ts"
  seq_len: 64
  min_points: 5
  snapshot_offset_days: 7    # Días antes del endDate para el cutoff TS (GRU)
  adaptive_cutoff: true      # Fallback adaptivo para mercados de vida < offset días (igual que baseline)

# Model hyperparameters
model:
  task: "classification"  # "classification" or "regression"
  num_categories: 10
  category_embed_dim: 8
  hidden_dims: [256, 128, 64]
  dropout: 0.3

ts_model:
  input_dim: 3
  hidden_dim: 128   # era 64 — más capacidad con 19k muestras
  num_layers: 2     # era 1
  dropout: 0.3      # era 0.2

# Training
training:
  epochs: 60
  learning_rate: 0.001
  batch_size: 64
  val_split: 0.15
  test_split: 0.15
  split_strategy: "random"   # "random" para iteración rápida, "temporal" para evaluación más realista
  seed: 42
  patience: 0                # 0 = sin early stopping; se guarda igualmente el mejor checkpoint por val AUC
  weight_decay: 0.0001
  use_weighted_sampler: true
  save_dir: "data/models/market_value_baseline"

ts_training:
  epochs: 80
  learning_rate: 0.001
  batch_size: 128   # era 64 — mejor throughput con 19k muestras
  val_split: 0.15
  test_split: 0.15
  split_strategy: "temporal" # se sobreescribe por CLI en cada run
  patience: 0       # sin early stopping; guarda mejor checkpoint por val AUC
  seed: 42
  save_dir: "data/models/price_sequence_gru"

# Scoring & Signals
scoring:
  top_k: 20
  max_markets: 1000
  buy_threshold: 0.6
  strong_buy_threshold: 0.75
  min_liquidity: 1000.0
  min_volume_24h: 100.0
  max_spread: 0.10

# Backtesting
backtesting:
  initial_capital: 1000.0
  position_size: 0.05
  threshold: 0.6
